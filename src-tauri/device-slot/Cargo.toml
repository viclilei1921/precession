[package]
name = "precession-device-slot"
version = "0.1.0"
description = "Android Keystore device slot for Precession"
authors = ["viclilei1921"]
edition = "2021"
license = "MIT OR Apache-2.0"
links = "precession-device-slot"
publish = false

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.11"
thiserror = "2"
