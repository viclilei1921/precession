# =============================================================================
# Precession 跨平台构建 — GitHub Actions
# =============================================================================
# 触发条件：推送 tag（v*）时自动构建，也可手动触发。
# 构建矩阵：Windows (NSIS)、macOS Apple Silicon (DMG)。
# 产物：每个平台的安装包上传为 Artifacts，tag 推送时额外创建 GitHub Release 草稿。
#
# 侧车（ffmpeg / cjxl / avifenc）提交在 Git LFS，以仓库中的裁剪静态构建为准。
# 检出后若文件缺失、或仍是 LFS 指针，构建直接失败，不下载兜底。
# =============================================================================

name: Cross-Platform Build

on:
  # 推送 v 开头的 tag 时触发（如 v0.1.0）
  push:
    tags:
      - "v*"

  # 支持手动触发，方便调试
  workflow_dispatch:

# 整个工作流级别的环境变量
env:
  CARGO_INCREMENTAL: 0          # CI 中关闭增量编译，避免缓存膨胀
  RUST_BACKTRACE: short         # 出错时打印简短的堆栈信息

# 同一分支 / tag 只保留最新的运行，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GITHUB_TOKEN 默认只读，创建 Release 和上传产物需要 contents 写权限
    permissions:
      contents: write

    strategy:
      # 即使某平台失败，其余平台继续构建
      fail-fast: false
      matrix:
        include:
          # ---- Windows x86_64 ----
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis                           # Windows 使用 NSIS 安装包

          # ---- macOS Apple Silicon (aarch64) ----
          - os: macos-latest                       # macos-latest = ARM runner
            target: aarch64-apple-darwin
            bundle: dmg

          # ---- Linux x86_64 ----
          # - os: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu
          #   bundle: deb,appimage

    runs-on: ${{ matrix.os }}

    steps:
      # =====================================================================
      # 1. 检出代码（含 Git LFS 侧车）
      # =====================================================================
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      # =====================================================================
      # 2. 安装系统级依赖（仅 Linux 需要）
      # =====================================================================
      # Tauri 在 Linux 上需要 GTK3、WebKit2GTK 等系统库
      # - name: Install Linux dependencies
      #   if: runner.os == 'Linux'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y \
      #       libwebkit2gtk-4.1-dev \
      #       libappindicator3-dev \
      #       librsvg2-dev \
      #       patchelf \
      #       libgtk-3-dev \
      #       libsoup-3.0-dev \
      #       libjavascriptcoregtk-4.1-dev

      # =====================================================================
      # 3. 安装 Rust 工具链并添加对应 target
      # =====================================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # =====================================================================
      # 4. 缓存 Rust 编译产物，显著加快后续构建
      # =====================================================================
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target     # 指定 Cargo 工作目录
          shared-key: ${{ matrix.target }}     # 按 target 区分缓存

      # =====================================================================
      # 5. 安装 pnpm / Node.js 并缓存依赖
      # =====================================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # =====================================================================
      # 6. 安装前端依赖
      # =====================================================================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # =====================================================================
      # 7. 确认侧车二进制已随仓库检出
      # =====================================================================
      # Tauri externalBin 按 target triple 查找：
      #   src-tauri/binaries/{ffmpeg,cjxl,avifenc}-{target_triple}[.exe]
      # 这些文件提交在 Git LFS。缺失或仍是 LFS 指针时直接失败，不下载兜底。
      - name: Verify sidecars
        shell: bash
        run: |
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          fi
          MISSING=0
          for NAME in ffmpeg cjxl avifenc; do
            BINARY_PATH="src-tauri/binaries/${NAME}-${{ matrix.target }}${EXT}"
            if [ ! -f "${BINARY_PATH}" ]; then
              echo "❌ 缺少侧车: ${BINARY_PATH}"
              MISSING=1
              continue
            fi
            HEADER="$(head -c 80 "${BINARY_PATH}" 2>/dev/null || true)"
            case "${HEADER}" in
              "version https://git-lfs.github.com/spec/v1"*)
                echo "❌ 侧车仍是 Git LFS 指针，未被检出: ${BINARY_PATH}"
                MISSING=1
                continue
                ;;
            esac
            chmod +x "${BINARY_PATH}" 2>/dev/null || true
            echo "✅ 侧车就绪: ${BINARY_PATH}"
          done
          if [ "${MISSING}" -ne 0 ]; then
            echo "侧车必须随仓库（Git LFS）提交，构建不会下载兜底版本。"
            exit 1
          fi

      # =====================================================================
      # 8. 使用 tauri-action 构建 + 打包
      # =====================================================================
      # tauri-action 会自动执行 beforeBuildCommand（pnpm build）并调用 cargo build
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名（可选，不签名也能构建）
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # Windows 签名（可选）
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 仅推送 tag 时创建 Release。手动触发只构建并上传 Artifact，
          # 避免把分支名（如 main）当成 tag 去建一个发布。
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Precession {0}', github.ref_name) || '' }}
          releaseBody: ${{ github.ref_type == 'tag' && format('Precession {0} 桌面安装包。', github.ref_name) || '' }}
          releaseDraft: true                   # 先创建为草稿，确认后手动发布
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      # =====================================================================
      # 9. 上传构建产物为 Artifact（即使不是 tag 触发也能下载）
      # =====================================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: precession-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.nsis*
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          if-no-files-found: warn              # 找不到文件时发出警告而非失败
          retention-days: 30                   # 产物保留 30 天
